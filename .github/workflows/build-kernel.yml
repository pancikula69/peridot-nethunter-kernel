name: Build NetHunter Kernel for POCO F6 (peridot)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl git zip python3 flex bison bc

      - name: Download Android Clang Toolchain
        run: |
          mkdir -p prebuilts/clang/host/linux-x86/clang-r487747c
          cd prebuilts/clang/host/linux-x86
          for i in 1 2 3; do
            echo "Download attempt $i..."
            curl -L --retry 5 --retry-delay 10 --max-time 900 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz" -o clang.tar.gz
            if [ -f clang.tar.gz ] && [ $(stat -c%s clang.tar.gz) -gt 500000000 ]; then
              echo "Download OK ($(du -sh clang.tar.gz | cut -f1))"
              break
            else
              echo "Download failed or too small, retrying..."
              rm -f clang.tar.gz
            fi
          done
          tar xzf clang.tar.gz -C clang-r487747c || { echo "Extract failed, retrying..."; rm -rf clang-r487747c/*; tar xzf clang.tar.gz -C clang-r487747c; }
          rm clang.tar.gz
          echo "Clang version:"
          ./clang-r487747c/bin/clang --version

      - name: Clone Kernel Source
        run: |
          cd /tmp
          git clone https://github.com/Peridot-Development/kernel_xiaomi_peridot.git -b peridot-u-oss --depth=1 msm-kernel
          mv msm-kernel /home/runner/work/peridot-nethunter-kernel/peridot-nethunter-kernel/

      - name: Apply KernelSU
        run: |
          cd msm-kernel
          if [ ! -d "KernelSU" ]; then
            curl -LSs --retry 5 "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          fi
          sed -i "/source.*hwid\/Kconfig/d" drivers/misc/Kconfig 2>/dev/null || true
          sed -i "/source.*kernelsu\/Kconfig/d" drivers/Kconfig 2>/dev/null || true
          find scripts -type f -exec chmod +x {} \; 2>/dev/null || true

      - name: Apply NetHunter Patches
        run: |
          cd msm-kernel
          
          # Clone kimocoder wireless modules (only rtl8188eus)
          if [ ! -d "drivers/net/wireless/realtek/rtl8188eus" ]; then
            git clone https://github.com/kimocoder/nethunter_wireless_modules.git /tmp/nethunter_wireless --depth=1
            cp -r /tmp/nethunter_wireless/rtl8188eus drivers/net/wireless/realtek/rtl8188eus
            rm -rf /tmp/nethunter_wireless
            echo "obj-\$(CONFIG_RTL8188EUS) += rtl8188eus/" >> drivers/net/wireless/realtek/Makefile
            echo "source \"drivers/net/wireless/realtek/rtl8188eus/Kconfig\"" >> drivers/net/wireless/realtek/Kconfig
            sed -i "s/---help---/help/g" drivers/net/wireless/realtek/rtl8188eus/Kconfig 2>/dev/null || true
          fi
          
          # Fix Realtek Kconfig
          head -20 drivers/net/wireless/realtek/Kconfig > /tmp/kconfig_fix
          echo "source \"drivers/net/wireless/realtek/rtl8188eus/Kconfig\"" >> /tmp/kconfig_fix
          echo "endif # WLAN_VENDOR_REALTEK" >> /tmp/kconfig_fix
          mv /tmp/kconfig_fix drivers/net/wireless/realtek/Kconfig
          
          # mac80211 injection patch
          wget -q --retry-connrefused --waitretry=10 --tries=5 https://raw.githubusercontent.com/kimocoder/mac80211_hwsim_injection/master/mac80211_injection_6.1.patch -O mac80211.patch || true
          patch -p1 < mac80211.patch 2>&1 || echo "Patch applied or skipped"

      - name: Configure Kernel
        run: |
          cd msm-kernel
          export ARCH=arm64
          export CLANG_PATH=$(pwd)/../prebuilts/clang/host/linux-x86/clang-r487747c/bin
          export PATH=$CLANG_PATH:$PATH
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_VERSION=170002
          
          make O=out gki_defconfig
          
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_USB_GADGET \
            -e CONFIG_USB_CONFIGFS \
            -e CONFIG_USB_CONFIGFS_F_HID \
            -e CONFIG_USB_CONFIGFS_UEVENT \
            -e CONFIG_USB_CONFIGFS_ACM \
            -e CONFIG_USB_CONFIGFS_OBEX \
            -e CONFIG_USB_CONFIGFS_NCM \
            -e CONFIG_USB_CONFIGFS_ECM \
            -e CONFIG_USB_CONFIGFS_ECM_SUBSET \
            -e CONFIG_USB_CONFIGFS_RNDIS \
            -e CONFIG_USB_CONFIGFS_EEM \
            -e CONFIG_USB_CONFIGFS_MASS_STORAGE \
            -e CONFIG_USB_CONFIGFS_F_FS \
            -e CONFIG_USB_CONFIGFS_F_ACC \
            -e CONFIG_USB_CONFIGFS_F_AUDIO_SRC \
            -e CONFIG_USB_CONFIGFS_F_UAC2 \
            -e CONFIG_USB_CONFIGFS_F_MIDI \
            -e CONFIG_USB_CONFIGFS_F_UVC \
            -e CONFIG_USB_CONFIGFS_F_PRINTER \
            -e CONFIG_USB_CONFIGFS_F_TCM \
            -e CONFIG_USB_CONFIGFS_F_CDM \
            -e CONFIG_USB_GADGET_VBUS_DRAW \
            -e CONFIG_USB_GADGETFS \
            -e CONFIG_USB_F_HID \
            -e CONFIG_USB_G_HID \
            -e CONFIG_HIDRAW \
            -e CONFIG_HID \
            -e CONFIG_USB_HID \
            -e CONFIG_USB_HIDDEV \
            -e CONFIG_USB_DUMMY_HCD \
            -e CONFIG_MAC80211 \
            -e CONFIG_MAC80211_HWSIM \
            -e CONFIG_CFG80211_WEXT \
            -e CONFIG_WIRELESS_EXT \
            -e CONFIG_WLAN_VENDOR_REALTEK \
            -m CONFIG_RTL8188EUS \
            -e CONFIG_BT \
            -e CONFIG_BT_RFCOMM \
            -e CONFIG_BT_HIDP \
            -m CONFIG_BT_HCIBTUSB \
            -m CONFIG_BT_HCIUART \
            -e CONFIG_NFS_FS \
            -e CONFIG_NFSD \
            -e CONFIG_WIREGUARD \
            -e CONFIG_IP_NF_TARGET_TTL \
            -e CONFIG_IP6_NF_TARGET_HL \
            -d CONFIG_DEBUG_INFO_BTF \
            -d CONFIG_DEBUG_INFO_BTF_MODULES \
            -d CONFIG_DEBUG_INFO \
            -d CONFIG_DEBUG_INFO_DWARF4 \
            -d CONFIG_DEBUG_INFO_DWARF5 \
            --set-val CONFIG_FRAME_WARN 4096
          
          make O=out olddefconfig
          
          # Force disable BTF and debug info
          sed -i "s/CONFIG_DEBUG_INFO_BTF=y/# CONFIG_DEBUG_INFO_BTF is not set/" out/.config
          sed -i "s/CONFIG_DEBUG_INFO_BTF_MODULES=y/# CONFIG_DEBUG_INFO_BTF_MODULES is not set/" out/.config
          sed -i "s/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/" out/.config
          sed -i "s/CONFIG_FRAME_WARN=2048/CONFIG_FRAME_WARN=4096/" out/.config
          make O=out olddefconfig

      - name: Build Kernel
        run: |
          cd msm-kernel
          export ARCH=arm64
          export CLANG_PATH=$(pwd)/../prebuilts/clang/host/linux-x86/clang-r487747c/bin
          export PATH=$CLANG_PATH:$PATH
          
          # Build with -k (keep going) to skip non-critical errors
          make O=out -j$(nproc) -k CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image 2>&1 | tail -40
          
          # Check if Image exists
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Image built!"
            ls -la out/arch/arm64/boot/Image
          else
            echo "Image not found, trying vmlinux..."
            make O=out -j$(nproc) -k CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip vmlinux 2>&1 | tail -20
            if [ -f "out/vmlinux" ]; then
              mkdir -p out/arch/arm64/boot
              llvm-objcopy -O binary out/vmlinux out/arch/arm64/boot/Image
              ls -la out/arch/arm64/boot/Image
            fi
          fi

      - name: Verify Build
        run: |
          if [ -f "msm-kernel/out/arch/arm64/boot/Image" ]; then
            echo "BUILD SUCCESS!"
            ls -la msm-kernel/out/arch/arm64/boot/Image
            echo "Modules:"
            find msm-kernel/out/ -name "*.ko" | head -20
          else
            echo "BUILD FAILED - Image not found"
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          mkdir -p anykernel
          cd anykernel
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 .
          rm -rf .git
          cp ../msm-kernel/out/arch/arm64/boot/Image ./
          mkdir -p modules/vendor/lib/modules/
          find ../msm-kernel/out/ -name "*.ko" -exec cp {} ./modules/vendor/lib/modules/ \; 2>/dev/null || true
          
          cat > anykernel.sh << "AKSH"
          properties() { 